name: Retail Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v4.3.9
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: retail-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      WAGO_PROJECT_ID: 5NR8QJK3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Build release zip
        id: package
        run: |
          set -euo pipefail
          ADDON_NAME="ElvUI_Enhanced"
          VERSION="${RELEASE_TAG}"
          DIST_DIR="dist"
          PKG_ROOT="${DIST_DIR}/${ADDON_NAME}"

          mkdir -p "${PKG_ROOT}"
          rsync -a ./ "${PKG_ROOT}/" \
            --exclude "/dist/" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "NOTES/" \
            --exclude ".claude/" \
            --exclude ".code/" \
            --exclude ".plan" \
            --exclude "CLAUDE.md*" \
            --exclude "GEMINI.md" \
            --exclude "*.bak" \
            --exclude "*.md"

          # The TOCs in the repo carry a placeholder; the tag is the version.
          sed -i "s/@project-version@/${VERSION#v}/" "${PKG_ROOT}"/*.toc
          if grep -q "@project-version@" "${PKG_ROOT}"/*.toc; then
            echo "A TOC still has the version placeholder" >&2
            exit 1
          fi

          (cd "${DIST_DIR}" && zip -r "../${ADDON_NAME}-${VERSION}.zip" "${ADDON_NAME}")
          echo "artifact=${ADDON_NAME}-${VERSION}.zip" >> "${GITHUB_OUTPUT}"

      - name: Generate checksum
        run: sha256sum "${{ steps.package.outputs.artifact }}" > "${{ steps.package.outputs.artifact }}.sha256"

      - name: Resolve retail release metadata
        id: retail_meta
        run: ./.github/scripts/retail-release-metadata.sh

      - name: Resolve edition versions
        id: editions
        run: |
          set -euo pipefail
          resolve() {
            WOW_UI_VERSION_URL="https://raw.githubusercontent.com/Gethe/wow-ui-source/$2/version.txt" GITHUB_OUTPUT= \
              ./.github/scripts/retail-release-metadata.sh | sed -n "s/^retail_version=/$1=/p" >> "${GITHUB_OUTPUT}"
          }
          resolve forever forever
          resolve classic classic_era
          resolve bcc classic_anniversary
          resolve mists classic
          resolve titan classic_titan

      - name: Verify edition versions exist on CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          FOREVER_VERSION: ${{ steps.editions.outputs.forever }}
          CLASSIC_VERSION: ${{ steps.editions.outputs.classic }}
          BCC_VERSION: ${{ steps.editions.outputs.bcc }}
          MISTS_VERSION: ${{ steps.editions.outputs.mists }}
          TITAN_VERSION: ${{ steps.editions.outputs.titan }}
        run: |
          set -euo pipefail
          # The upload action silently drops unknown version names.
          VERSIONS=$(curl -fsS -H "X-Api-Token: ${CURSEFORGE_TOKEN}" https://wow.curseforge.com/api/game/versions)
          check() {
            if ! jq -e --argjson t "$2" --arg v "$3" \
              'any(.[]; .gameVersionTypeID == $t and .name == $v)' <<< "${VERSIONS}" >/dev/null; then
              echo "CurseForge has no $1 game version '$3' yet" >&2
              exit 1
            fi
          }
          check Forever 88568 "${FOREVER_VERSION}"
          check "Classic Era" 67408 "${CLASSIC_VERSION}"
          check "Burning Crusade Classic Anniversary" 73246 "${BCC_VERSION}"
          check "Mists of Pandaria Classic" 79434 "${MISTS_VERSION}"
          check "Titan Reforged" 81212 "${TITAN_VERSION}"

      - name: Resolve Wago patches
        id: wago_patch
        run: |
          set -euo pipefail
          GAME_DATA=$(curl -fsSL https://addons.wago.io/api/data/game)
          for t in retail forever classic bc mop titan; do
            v=$(jq -er --arg k "supported_${t}_patches" '.live_patches[$k]' <<< "${GAME_DATA}")
            echo "${t}=${v}" >> "${GITHUB_OUTPUT}"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          generate_release_notes: true

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: 1490221
          game_endpoint: wow
          file_path: ${{ steps.package.outputs.artifact }}
          display_name: ElvUI Enhanced (Yet) Again ${{ env.RELEASE_TAG }}
          game_versions: "${{ steps.retail_meta.outputs.retail_version }},88568:${{ steps.editions.outputs.forever }},67408:${{ steps.editions.outputs.classic }},73246:${{ steps.editions.outputs.bcc }},79434:${{ steps.editions.outputs.mists }},81212:${{ steps.editions.outputs.titan }}"
          release_type: release
          changelog: "See release notes at https://github.com/bloqaudio/ElvUI_Enhanced_Yet_Again/releases/tag/${{ env.RELEASE_TAG }}"
          changelog_type: text

      - name: Upload to Wago
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WAGO_API_TOKEN}" ]; then
            echo "Missing WAGO_API_TOKEN secret" >&2
            exit 1
          fi

          METADATA=$(jq -nc \
            --arg label "${RELEASE_TAG}" \
            --arg changelog "See release notes at https://github.com/bloqaudio/ElvUI_Enhanced_Yet_Again/releases/tag/${RELEASE_TAG}" \
            --arg retail "${{ steps.wago_patch.outputs.retail }}" \
            --arg forever "${{ steps.wago_patch.outputs.forever }}" \
            --arg classic "${{ steps.wago_patch.outputs.classic }}" \
            --arg bc "${{ steps.wago_patch.outputs.bc }}" \
            --arg mop "${{ steps.wago_patch.outputs.mop }}" \
            --arg titan "${{ steps.wago_patch.outputs.titan }}" \
            '{label:$label,stability:"stable",changelog:$changelog,supported_retail_patches:[$retail],supported_forever_patches:[$forever],supported_classic_patches:[$classic],supported_bc_patches:[$bc],supported_mop_patches:[$mop],supported_titan_patches:[$titan]}')

          curl -fsS -X POST \
            -H "Authorization: Bearer ${WAGO_API_TOKEN}" \
            -H "accept: application/json" \
            -F "metadata=${METADATA}" \
            -F "file=@${{ steps.package.outputs.artifact }}" \
            "https://addons.wago.io/api/projects/${WAGO_PROJECT_ID}/version"
